const pages=(window.B64||[]).map(x=>'data:image/webp;base64,'+x);let i=0,busy=false;const cur=currentImg,under=underImg,turner=document.getElementById('turner'),front=frontImg,back=backImg,count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');function render(){cur.src=pages[i];under.src=pages[i];count.textContent=(i+1)+' / '+pages.length;prev.disabled=i===0;next.disabled=i===pages.length-1}function flip(dir){if(busy||dir>0&&i>=pages.length-1||dir<0&&i<=0)return;busy=true;const ni=i+dir;under.src=pages[ni];front.src=pages[i];back.src=pages[ni];turner.className='turner '+(dir>0?'next animate-next':'prev animate-prev');turner.addEventListener('animationend',()=>{i=ni;render();turner.className='turner';busy=false},{once:true})}prev.onclick=()=>flip(-1);next.onclick=()=>flip(1);left.onclick=()=>flip(-1);right.onclick=()=>flip(1);full.onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')flip(1);if(e.key==='ArrowLeft')flip(-1)});let sx=0;stage.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)flip(dx<0?1:-1)},{passive:true});render();
